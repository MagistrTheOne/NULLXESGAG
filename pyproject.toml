[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-gag-cap-vc"
version = "0.1.0"
description = "CPU-first, auditable quantitative financial research foundation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pandas>=2.1", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "scipy>=1.12", "statsmodels>=0.14", "arch>=7", "pydantic>=2.7"]

[project.optional-dependencies]
terminal = ["streamlit>=1.39"]
qwen = ["llama-cpp-python>=0.3"]
calibration = ["scikit-learn>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
gagcap = "gagcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicit network integration checks; run only in Colab"]
